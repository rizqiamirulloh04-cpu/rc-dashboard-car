[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Otomatis download library TFT_eSPI
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43

; Mengirim parameter User_Setup langsung ke compiler (Pengganti User_Setup.h)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=172
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_BL=22
    -D TFT_MOSI=6
    -D TFT_SCLK=7
    -D TFT_CS=14
    -D TFT_DC=15
    -D TFT_RST=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
